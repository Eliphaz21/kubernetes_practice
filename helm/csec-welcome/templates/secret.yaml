apiVersion: v1
kind: Secret
metadata:
  name: {{ include "csec-welcome.fullname" . }}-backend-secret
  labels:
    {{- include "csec-welcome.labels" . | nindent 4 }}
    tier: backend
type: Opaque
stringData:
  SESSION_SECRET: {{ .Values.backend.secret.sessionSecret | quote }}
  API_KEY: {{ .Values.backend.secret.apiKey | quote }}
