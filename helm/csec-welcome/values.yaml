# ==============================================================================
# CSEC ASTU - Default Helm Chart Values (csec-welcome)
# ==============================================================================

# Global Configurations
global:
  environment: "production"
  organization: "csec-astu"

# ------------------------------------------------------------------------------
# Backend Service (Node.js + Express + TypeScript)
# ------------------------------------------------------------------------------
backend:
  replicaCount: 2
  image:
    repository: csec-astu/csec-welcome-backend
    pullPolicy: IfNotPresent
    tag: "latest"
  service:
    type: ClusterIP
    port: 5000
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi
  livenessProbe:
    path: /api/health
    initialDelaySeconds: 10
    periodSeconds: 15
  readinessProbe:
    path: /api/ready
    initialDelaySeconds: 5
    periodSeconds: 10
  env:
    PORT: "5000"
    HOST: "0.0.0.0"
    NODE_ENV: "production"
    CORS_ORIGIN: "*"
  secret:
    sessionSecret: "csec-helm-session-secret-key-32chars"
    apiKey: "csec-helm-api-key-2026"

# ------------------------------------------------------------------------------
# Frontend Service (React 18 + Nginx SPA)
# ------------------------------------------------------------------------------
frontend:
  replicaCount: 2
  image:
    repository: csec-astu/csec-welcome-frontend
    pullPolicy: IfNotPresent
    tag: "latest"
  service:
    type: NodePort
    port: 80
    nodePort: 30080
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 150m
      memory: 128Mi
  livenessProbe:
    path: /healthz
    initialDelaySeconds: 5
    periodSeconds: 15
  readinessProbe:
    path: /healthz
    initialDelaySeconds: 3
    periodSeconds: 10
  env:
    APP_ENV: "production"
    APP_TITLE: "CSEC ASTU Development Division"

# ------------------------------------------------------------------------------
# Ingress Controller Routing
# ------------------------------------------------------------------------------
ingress:
  enabled: true
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
  host: "csec.local"
  tls: []

# ------------------------------------------------------------------------------
# Autoscaling (HPA)
# ------------------------------------------------------------------------------
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

# ------------------------------------------------------------------------------
# RBAC & Security
# ------------------------------------------------------------------------------
serviceAccount:
  create: true
  name: "csec-app-sa"
