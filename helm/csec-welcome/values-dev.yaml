# ==============================================================================
# CSEC ASTU - Development / Minikube Overrides
# Optimized for minimal resource consumption on local developer workstations
# ==============================================================================

global:
  environment: "development"

backend:
  replicaCount: 1
  image:
    repository: csec-astu/csec-welcome-backend
    pullPolicy: IfNotPresent
    tag: "latest"
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 150m
      memory: 128Mi

frontend:
  replicaCount: 1
  image:
    repository: csec-astu/csec-welcome-frontend
    pullPolicy: IfNotPresent
    tag: "latest"
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi

ingress:
  enabled: true
  className: "nginx"
  host: "csec.local"

autoscaling:
  enabled: false
