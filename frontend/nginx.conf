# ==============================================================================
# CSEC Welcome Frontend - Nginx Web Server & Reverse Proxy Configuration
# Serves static React files and proxies /api requests to Express backend
# ==============================================================================

server {
    listen 80;
    server_name localhost;

    # Root directory for static production bundle
    root /usr/share/nginx/html;
    index index.html;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Healthcheck endpoint for container orchestration
    location /healthz {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    # Reverse proxy: forward /api requests to the backend container
    location /api/ {
        # Resolves via Kubernetes CoreDNS and Docker internal DNS
        resolver 127.0.0.11 kube-dns.kube-system.svc.cluster.local 10.96.0.10 valid=10s ipv6=off;
        set $backend_target "http://csec-backend:5000";
        proxy_pass $backend_target;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Single Page Application (SPA) fallback to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets efficiently
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }
}
