# ==============================================================================
# CSEC ASTU - Frontend Deployment
# Manages the replicated React 18 + Nginx Web Server Pods
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: csec-frontend
  namespace: csec-learning
  labels:
    app: csec-welcome
    tier: frontend
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: csec-welcome
      tier: frontend
  template:
    metadata:
      labels:
        app: csec-welcome
        tier: frontend
    spec:
      containers:
        - name: frontend
          image: csec-astu/csec-welcome-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          # Resource Requests & Limits
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 150m
              memory: 128Mi
          # Liveness Probe
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          # Readiness Probe
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 2
          # Security Hardening
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - AUDIT_WRITE
                - KILL
          # ConfigMap environment injection
          envFrom:
            - configMapRef:
                name: csec-frontend-config

