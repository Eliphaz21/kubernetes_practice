# ==============================================================================
# CSEC ASTU - Backend Deployment
# Manages the replicated Node.js + Express + TypeScript API Pods
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: csec-backend
  namespace: csec-learning
  labels:
    app: csec-welcome
    tier: backend
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: csec-welcome
      tier: backend
  template:
    metadata:
      labels:
        app: csec-welcome
        tier: backend
    spec:
      # Security Context at Pod Level
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: backend
          image: csec-astu/csec-welcome-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5000
              protocol: TCP
          # Resource Management (Requests & Limits)
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          # Liveness Probe: Restarts container if deadlocked/crashed
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          # Readiness Probe: Routes traffic only when application is ready
          readinessProbe:
            httpGet:
              path: /api/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 2
          # Container-level Security Context
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          # Environment Variables from ConfigMap and Secret
          envFrom:
            - configMapRef:
                name: csec-backend-config
            - secretRef:
                name: csec-backend-secret

