# ==============================================================================
# CSEC ASTU - Kubernetes Secrets Template
# Demonstrates storing sensitive key-value pairs (Base64 encoded)
# NOTE: In production, secrets are managed via AWS Secrets Manager, HashiCorp Vault,
# or SealedSecrets. Never commit real production credentials to Git!
# ==============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: csec-backend-secret
  namespace: csec-learning
  labels:
    app: csec-welcome
    tier: backend
type: Opaque
stringData:
  # stringData automatically base64-encodes values when applied by kube-apiserver
  SESSION_SECRET: "csec-training-super-secret-key-32chars"
  API_KEY: "csec-astu-dev-division-token-2026"

