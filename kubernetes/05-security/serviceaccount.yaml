# ==============================================================================
# CSEC ASTU - Dedicated Application ServiceAccount
# Provides a distinct cryptographic identity for application Pods
# ==============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: csec-app-sa
  namespace: csec-learning
  labels:
    app: csec-welcome
# Security hardening: Disable automatic API token mounting if pod does not call kube-apiserver
automountServiceAccountToken: false
