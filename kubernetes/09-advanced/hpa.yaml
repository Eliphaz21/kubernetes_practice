# ==============================================================================
# CSEC ASTU - Horizontal Pod Autoscaler (HPA v2)
# Automatically scales backend replicas between 2 and 6 based on CPU utilization
# ==============================================================================
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: csec-backend-hpa
  namespace: csec-learning
  labels:
    app: csec-welcome
    tier: backend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: csec-backend
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
    scaleDown:
      stabilizationWindowSeconds: 300 # 5 min cooling-off to prevent flapping
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60

