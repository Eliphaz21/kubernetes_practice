# ==============================================================================
# CSEC ASTU - Ingress Controller Rules
# Routes external HTTP traffic based on host and path
# Host: csec.local (or Minikube IP)
# Path /      -> csec-frontend Service (port 80)
# Path /api   -> csec-backend Service (port 5000)
# ==============================================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: csec-ingress
  namespace: csec-learning
  labels:
    app: csec-welcome
  annotations:
    # Use standard Nginx Ingress Controller
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    # SSL/TLS redirect can be enabled when certificates are configured
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  rules:
    - host: csec.local
      http:
        paths:
          # Frontend React SPA
          - path: /
            pathType: Prefix
            backend:
              service:
                name: csec-frontend
                port:
                  number: 80
          # Backend Express REST API
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: csec-backend
                port:
                  number: 5000
