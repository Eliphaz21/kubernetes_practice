# ==============================================================================
# CSEC ASTU - Frontend Service (NodePort)
# Provides cluster-internal routing and exposes a static node port for Minikube
# ==============================================================================
apiVersion: v1
kind: Service
metadata:
  name: csec-frontend
  namespace: csec-learning
  labels:
    app: csec-welcome
    tier: frontend
spec:
  type: NodePort
  selector:
    app: csec-welcome
    tier: frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30080
      protocol: TCP

